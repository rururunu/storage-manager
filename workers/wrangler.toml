name = "storage-manager"
main = "src/index.ts"
workers_dev = false
logpush = false
compatibility_date = "2023-10-30"

# required since we use node crypto's streaming HMAC
compatibility_flags = ["nodejs_compat"]

routes = [
	{ pattern = "storage-manager.antennapro.org", custom_domain = true }
]

r2_buckets = [
	{ binding = "ATTACHMENT_BUCKET", bucket_name = "antenna-v2-attachments" },
	{ binding = "BACKUP_BUCKET", bucket_name = "antenna-v2-backups" }
]

[vars]
GCS_BUCKET = "unused"
